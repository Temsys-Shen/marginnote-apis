    - "$ref": "#/servers/0"
    parameters: []
    x-platforms:
    - iOS
    - iPadOS
    x-platform-note: 仅跨设备接入场景注册；Mac Catalyst 同机 CLI/Bridge 构建不注册该路由。运行时请以 GET /capabilities
      返回的路由清单为准。
