        '200':
          description: 请求成功。
          headers:
            Content-Type:
              "$ref": "#/components/headers/JsonContentType"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GenericSuccessResponse"
              example: &1
                bridgeApiVersion: '0.39'
              examples:
                sample:
                  summary: 成功响应示例
                  value: *1
          links: {}
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
        '500':
          "$ref": "#/components/responses/InternalError"
        default:
          description: 错误响应。Bridge 使用统一错误 envelope，包含机器可读 code、人类可读 message、retryable
            标记和可选 details 对象。
          headers:
            Content-Type:
              "$ref": "#/components/headers/JsonContentType"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
              example:
                bridgeApiVersion: '0.39'
                error:
                  code: INVALID_INPUT
                  message: 请求无效。
                  retryable: false
                  details: {}
              examples:
                invalidInput:
                  "$ref": "#/components/examples/InvalidInputError"
                unauthorized:
                  "$ref": "#/components/examples/UnauthorizedError"
          links: {}
