---
openapi: 3.1.0
info:
  title: MarginNote CLI / Local Bridge API
  summary: MarginNote 本地 CLI Bridge 的 OpenAPI 3.1 草稿契约。
  description: 本文件根据当前 MarginNote Local Bridge 路由目录和 CLI 契约说明生成。当前仓库未发现官方手工维护的标准 OpenAPI
    文件。生成 client 或做自动化调用前，应先读取运行时 GET /capabilities 并比对 apiFingerprint；若静态文档与运行时能力冲突，以运行时为准。本文已标注
    iOS/iPadOS 跨设备限定接口；Mac 同机 CLI/Bridge 不注册这些限定路由。
  termsOfService: 本地内部评估草稿；仓库内未发布公开服务条款。
  contact:
    name: MarginNote Local Bridge 维护者
    url: about:blank
    email: 未公开
  license:
    name: 专有内部草稿
    identifier: LicenseRef-Proprietary
    url: about:blank
  version: 0.39-draft
externalDocs:
  description: 配对后可通过 GET /guide 读取运行时操作规程；静态契约来源为仓库内 CLI V0 契约文档。
  url: about:blank
servers:
- url: "/bridge/v1"
  description: MarginNote Bridge 服务。主机和端口由运行时发现，本共享草稿故意不写入网络地址。
  variables:
    port:
      default: runtime-discovered
      description: 从本地发现或跨设备配对流程获得的 Bridge 端口。
      enum:
      - runtime-discovered
security:
- bearerAuth: []
tags:
- name: status
  description: 状态、运行时能力和操作规程读取。
  externalDocs:
    description: 工作流级约束请读取运行时 guide。
    url: about:blank
- name: library
  description: 资料库、文档、文件夹和学习集创建相关操作。
  externalDocs:
    description: 工作流级约束请读取运行时 guide。
    url: about:blank
- name: study-sets
  description: 学习集、脑图树、子脑图、快照和学习集内文档操作。
  externalDocs:
    description: 工作流级约束请读取运行时 guide。
    url: about:blank
- name: documents
  description: 文档检索、页面、目录、定位、上传和删除操作。
  externalDocs:
    description: 工作流级约束请读取运行时 guide。
    url: about:blank
- name: notes
  description: 卡片内容、移动、复制、标签、元数据和渲染操作。
  externalDocs:
    description: 工作流级约束请读取运行时 guide。
    url: about:blank
- name: decks
  description: 复习卡组及卡组卡片操作。
  externalDocs:
    description: 工作流级约束请读取运行时 guide。
    url: about:blank
- name: bundles
  description: 拆书 bundle 的准备、提交、聚焦、丢弃和文件读取。
  externalDocs:
    description: 工作流级约束请读取运行时 guide。
    url: about:blank
- name: ui
  description: 当前上下文和 UI 状态读写。
  externalDocs:
    description: 工作流级约束请读取运行时 guide。
    url: about:blank
- name: setup
  description: 安装、配对和跨设备接入。
  externalDocs:
    description: 工作流级约束请读取运行时 guide。
    url: about:blank
- name: mcp
  description: Streamable HTTP MCP 接入。
  externalDocs:
    description: 工作流级约束请读取运行时 guide。
    url: about:blank
