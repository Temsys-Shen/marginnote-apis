components:
  schemas:
    GenericJsonRequest:
      type: object
      description: 通用 JSON 请求占位 schema。当前代码库未给所有端点暴露逐字段 schema 单一事实源时使用。
      additionalProperties: true
    ConfirmRequest:
      type: object
      description: 破坏性操作或覆盖操作的确认门。
      properties:
        confirm:
          type: boolean
          const: true
          description: 端点要求显式确认时必须为 true。
      additionalProperties: true
    BundlePrepareRequest:
      type: object
      description: 从文档片段或页码范围准备拆书 bundle。
      properties:
        topicid:
          type: string
        bookmd5:
          type: string
        segments:
          type: array
          items:
            "$ref": "#/components/schemas/DocumentSegment"
        pageRange:
          "$ref": "#/components/schemas/PageRange"
        preset:
          type: string
          enum:
          - book-breakdown
          - source-structure
          - exam-general
          - dictionary
        anchorMode:
          type: string
          enum:
          - page_text
          - block
        title:
          type: string
      additionalProperties: true
    DocumentSegment:
      type: object
      properties:
        title:
          type: string
        startPage:
          type: integer
          minimum: 1
        endPage:
          type: integer
          minimum: 1
      additionalProperties: true
    PageRange:
      type: object
      properties:
        startPage:
          type: integer
          minimum: 1
        endPage:
          type: integer
          minimum: 1
      additionalProperties: false
    DocumentUploadRequest:
      type: object
      description: multipart 文件上传载荷。
      properties:
        file:
          type: string
          format: binary
        folderId:
          type: string
      required:
      - file
    NoteCopyRequest:
      type: object
      properties:
        noteIds:
          type: array
          items:
            type: string
          maxItems: 50
        targetParentNoteId:
          type: string
        mode:
          type: string
          enum:
          - reference
          - clone
        copies:
          type: array
          items:
            type: object
            additionalProperties: true
        confirm:
          type: boolean
      additionalProperties: true
    NoteHashtagsRequest:
      type: object
      properties:
        noteIds:
          type: array
          items:
            type: string
          maxItems: 200
        operation:
          type: string
          enum:
          - add
          - remove
          - replace
        hashtags:
          type: array
          items:
            type: string
        includeDescendants:
          type: boolean
        confirm:
          type: boolean
      additionalProperties: true
    NoteDeleteRequest:
      type: object
      properties:
        noteIds:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 50
        confirm:
          type: boolean
          const: true
      additionalProperties: true
    JsonRpcRequest:
      type: object
      required:
      - jsonrpc
      - method
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          oneOf:
          - type: string
          - type: integer
          - type: 'null'
        method:
          type: string
        params:
          type: object
          additionalProperties: true
    JsonRpcResponse:
      type: object
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          oneOf:
          - type: string
          - type: integer
          - type: 'null'
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          additionalProperties: true
      additionalProperties: true
    GenericSuccessResponse:
      type: object
      required:
      - bridgeApiVersion
      properties:
        bridgeApiVersion:
          type: string
          description: Bridge API 版本。
        ignoredFields:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    ListResponse:
      allOf:
      - "$ref": "#/components/schemas/GenericSuccessResponse"
      - type: object
        properties:
          items:
            type: array
            items:
              type: object
              additionalProperties: true
          nextCursor:
            oneOf:
            - type: string
            - type: 'null'
          truncated:
            type: boolean
        additionalProperties: true
    StatusResponse:
      allOf:
      - "$ref": "#/components/schemas/GenericSuccessResponse"
      - type: object
        properties:
          app:
            type: string
          appVersion:
            type: string
          instanceNonce:
            type: string
          enabled:
            type: boolean
          authorized:
            type: boolean
          routeCount:
            type: integer
          apiFingerprint:
            type: string
            pattern: "^[0-9a-f]{12}$"
          guideVersion:
            type: string
          guideHash:
            type: string
          guide:
            "$ref": "#/components/schemas/GuideInfo"
        additionalProperties: true
    GuideInfo:
      type: object
      properties:
        version:
          type: string
        sha256:
          type: string
        route:
          type: string
        refreshPolicy:
          type: string
        usesExistingBearer:
          type: boolean
        installRequired:
          type: boolean
        rotatesToken:
          type: boolean
      additionalProperties: true
    CapabilitiesResponse:
      allOf:
      - "$ref": "#/components/schemas/GenericSuccessResponse"
      - type: object
        properties:
          routes:
            type: array
            items:
              "$ref": "#/components/schemas/RouteDescriptor"
          routeCount:
            type: integer
          presets:
            type: array
            items:
              type: string
          anchorModes:
            type: array
            items:
              type: string
          apiFingerprint:
            type: string
          guide:
            "$ref": "#/components/schemas/GuideInfo"
          bundlePrepare:
            type: object
            additionalProperties: true
          noteHashtags:
            type: object
            additionalProperties: true
          noteCopy:
            type: object
            additionalProperties: true
        additionalProperties: true
    RouteDescriptor:
      type: object
      required:
      - method
      - path
      properties:
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
          - HEAD
          - TRACE
        path:
          type: string
      additionalProperties: true
    GuideResponse:
      allOf:
      - "$ref": "#/components/schemas/GenericSuccessResponse"
      - type: object
        properties:
          markdown:
            type: string
          guide:
            "$ref": "#/components/schemas/GuideInfo"
        additionalProperties: true
    ErrorEnvelope:
      type: object
      required:
      - bridgeApiVersion
      - error
      properties:
        bridgeApiVersion:
          type: string
        error:
          "$ref": "#/components/schemas/ErrorObject"
      additionalProperties: false
    ErrorObject:
      type: object
      required:
      - code
      - message
      - retryable
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
      additionalProperties: true
